  CAVEATS: gate85-plain still CI-negative at >=5.2x (-0.24*/-0.61* vs fixed's -0.42*/-0.97* --
  softens ~37%, does not flip); real LPIPS regression vs fixed grows with speed (-0.002 ->
  -0.019 raw by tau1.4) -- PSNR win at speed is not free. At tau1.4 (past SeaCache's 4.39x
  swept ceiling) ALL variants lose to SeaCache universally (fixed -1.18*, gate85 -0.82*) --
  not gate-specific. Partial N=72 check mid-run (before full completion) already showed this
  exact pattern with tighter CIs -- no reversal risk, consolidation was worth letting finish.
